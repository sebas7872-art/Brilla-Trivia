name: Restore original sources from release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESTORE to confirm you already published the release tag original-source with the ZIP attached'
        required: true
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  restore:
    if: github.event.inputs.confirm == 'RESTORE'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download ZIP from release tag original-source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Looking for release tag original-source..."
          gh release download original-source \
            --repo ${{ github.repository }} \
            --pattern "*.zip" \
            --dir /tmp/restore || {
              echo "ERROR: No se pudo descargar el release. Verificá que exista el tag 'original-source' y que el ZIP esté adjunto."
              exit 1
            }
          ls -la /tmp/restore/
          ZIP=$(ls /tmp/restore/*.zip | head -1)
          echo "ZIP encontrado: $ZIP"
          echo "ZIP_PATH=$ZIP" >> $GITHUB_ENV

      - name: Verify ZIP has no sensitive files
        run: |
          set -e
          unzip -l "$ZIP_PATH" | tee /tmp/zip-list.txt
          if grep -E '\.(jks|keystore|p12|pem)$|local\.properties|signing' /tmp/zip-list.txt; then
            echo "ERROR: El ZIP contiene posibles archivos sensibles. Abortando."
            exit 1
          fi
          echo "OK: No se detectaron claves de firma ni credenciales."

      - name: Extract and restore exact files
        run: |
          set -e
          mkdir -p /tmp/extracted
          unzip -o "$ZIP_PATH" -d /tmp/extracted

          SRC=$(find /tmp/extracted -type d -name "Brilla-Trivia" | head -1)
          if [ -z "$SRC" ]; then
            SRC=$(find /tmp/extracted -maxdepth 2 -type d | head -2 | tail -1)
          fi
          echo "Source root: $SRC"
          ls -la "$SRC"

          # Lista obligatoria: si falta cualquiera, el workflow falla
          declare -a MANDATORY=(
            "app/src/main/java/ar/com/brilla/trivia/ui/MainActivity.kt"
            "app/src/main/java/ar/com/brilla/trivia/AppRuntime.kt"
            "app/src/main/java/ar/com/brilla/trivia/data/Database.kt"
            "app/src/main/java/ar/com/brilla/trivia/ui/FloatingPanel.kt"
            "app/src/androidTest/java/ar/com/brilla/trivia/DeviceTests.kt"
            "app/src/test/java/ar/com/brilla/trivia/CoreTest.kt"
            "app/src/main/java/ar/com/brilla/trivia/core/TriviaEngine.kt"
            "app/src/main/java/ar/com/brilla/trivia/core/Importer.kt"
            "app/src/main/java/ar/com/brilla/trivia/core/Templates.kt"
            "app/src/main/java/ar/com/brilla/trivia/core/Models.kt"
            "app/src/main/java/ar/com/brilla/trivia/access/ChatAdapters.kt"
            "app/src/main/java/ar/com/brilla/trivia/access/AutomaticSender.kt"
            "app/src/main/java/ar/com/brilla/trivia/access/TreeReader.kt"
            "app/src/main/java/ar/com/brilla/trivia/access/TriviaAccessibilityService.kt"
            "app/src/main/java/ar/com/brilla/trivia/BrillaApp.kt"
            "app/src/main/java/ar/com/brilla/trivia/ui/Style.kt"
            "app/src/main/AndroidManifest.xml"
            "app/build.gradle.kts"
            "build.gradle.kts"
            "settings.gradle.kts"
            "gradle.properties"
            "gradle/wrapper/gradle-wrapper.properties"
            "gradle/wrapper/gradle-wrapper.jar"
            "gradlew"
            "gradlew.bat"
            "fixture/build.gradle.kts"
            "fixture/src/main/AndroidManifest.xml"
            "fixture/src/main/java/ar/com/brilla/fixture/ChatActivity.kt"
            "fixture/src/main/res/values/ids.xml"
            "app/schemas/ar.com.brilla.trivia.data.TriviaDatabase/1.json"
          )

          MISSING=0
          for f in "${MANDATORY[@]}"; do
            if [ -f "$SRC/$f" ]; then
              mkdir -p "$(dirname "$f")"
              cp -f "$SRC/$f" "$f"
              echo "Restored: $f ($(wc -c < "$f") bytes)"
            else
              echo "ERROR: Archivo obligatorio ausente en el ZIP: $f"
              MISSING=1
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo "Abortando: faltan archivos obligatorios."
            exit 1
          fi

          # Restaurar el resto de fuentes por si hubiera más
          find "$SRC/app/src" -type f \( -name "*.kt" -o -name "*.xml" -o -name "*.json" \) | while read srcf; do
            rel=${srcf#$SRC/}
            mkdir -p "$(dirname "$rel")"
            cp -f "$srcf" "$rel"
          done

          chmod +x gradlew || true

      - name: Verify MD5 of the six critical files (must match original ZIP)
        run: |
          set -e
          echo "Comparando MD5 con los valores originales del ZIP de Astra..."

          declare -A EXPECTED=(
            ["app/src/main/java/ar/com/brilla/trivia/ui/MainActivity.kt"]="ab0fee3c63a143b9265066cd2f192a55"
            ["app/src/main/java/ar/com/brilla/trivia/AppRuntime.kt"]="cd56dd867bf484328457c0ecb8595e47"
            ["app/src/main/java/ar/com/brilla/trivia/data/Database.kt"]="2f1b0cfbb44c0bcca2629a523a5703c2"
            ["app/src/main/java/ar/com/brilla/trivia/ui/FloatingPanel.kt"]="a3946f34e4587f4793baa77b08cbe082"
            ["app/src/androidTest/java/ar/com/brilla/trivia/DeviceTests.kt"]="61f165c49329bc988c8d350a97bb7d76"
            ["app/src/test/java/ar/com/brilla/trivia/CoreTest.kt"]="2a41302f29c30b9d2a21ba0936394176"
          )

          FAILED=0
          for f in "${!EXPECTED[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Falta el archivo $f"
              FAILED=1
              continue
            fi
            ACTUAL=$(md5sum "$f" | awk '{print $1}')
            EXPECT=${EXPECTED[$f]}
            if [ "$ACTUAL" = "$EXPECT" ]; then
              echo "OK  $f  ($ACTUAL)"
            else
              echo "MISMATCH  $f"
              echo "  esperado: $EXPECT"
              echo "  actual:   $ACTUAL"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "ERROR: Uno o más archivos críticos no coinciden con el ZIP original. No se hará commit."
            exit 1
          fi
          echo "Todos los hashes de los 6 archivos críticos coinciden."

      - name: Commit restored sources
        run: |
          set -e
          git config user.name "Brilla Restore Bot"
          git config user.email "restore-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit (files already match)."
          else
            git commit -m "Restore exact original sources from release tag original-source"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build both debug APKs
        run: |
          set -e
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug :fixture:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug :fixture:assembleDebug --stacktrace
          fi

      - name: Upload app APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Brilla-Trivia-app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload fixture APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Brilla-Trivia-fixture-debug
          path: fixture/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
