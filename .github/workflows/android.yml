name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build debug APKs
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug :fixture:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug :fixture:assembleDebug --stacktrace
          fi

      - name: Upload app APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Brilla-Trivia-app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload fixture APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Brilla-Trivia-fixture-debug
          path: fixture/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
